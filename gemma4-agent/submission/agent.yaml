name: fixer
model: gemma-4-31b-it-qat-w4a16-ct
description: Fixes a bug or adds a small feature in a Python repository and submits the patch.
instruction: !include prompts/system.md
generate_content_config: !include configs/sampling.yaml
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
  - get_status
  - submit_patch
  - agent_tool:
      config_path: sub_agents/locator.yaml
      skip_summarization: false
  - agent_tool:
      config_path: sub_agents/checker.yaml
      skip_summarization: false
