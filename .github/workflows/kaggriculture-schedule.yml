name: Kaggriculture Schedule

# Hill-climb the capital calendar -- what the farm owns, day by day -- and let
# main.py's policy keep the field work.
#
# This exists because the sibling workflow's genome did not transfer. Climbing
# the 720-step action list for four hours moved the training win count from 7
# to 8 out of 12 while the held-out count sat at 1 the entire run, and the
# result lost 24 games out of 24 to the live agent. A recorded list is welded
# to the season it was recorded in: most of what it stores is which tile
# happened to need water at hour 9.
#
# What is not welded to the season is the capital, and the capital is the whole
# measured difference between this farm and a strong published one: 12 animals
# against 27, care delivered on 100% of animal-days against 62%, 1,010
# waterings against 595, wheat net +290 against net -55, quadrants bought on
# days 6 and 10 against day 8 alone. "Carry eight cows and buy the second
# quadrant on day 6" is as true of the next season as of this one.
#
# Results go to the `kaggriculture-schedules` branch. Deliberately not the
# `kaggriculture-plans` branch: that one is rewritten as a single orphan commit
# each run, so sharing it would have the two searches delete each other.

on:
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図（必須）'
        required: true
        type: string
      mode:
        description: 'climb = hill-climb the calendar. calibrate = measure the ruler (paired noise band, winner curse, acceptance rules). score = play the calendars in `start` on the `seeds`, side by side, and write nothing'
        required: false
        default: 'climb'
        type: choice
        options: [climb, calibrate, score]
      children:
        description: 'calibrate only: mutated children to measure (with per_op, this many from each operator)'
        required: false
        default: '8'
        type: string
      per_op:
        description: 'calibrate only: give each child exactly one operator, so the effect can be attributed to it'
        required: false
        default: false
        type: boolean
      only:
        description: 'calibrate + per_op: measure only these operators, comma separated (e.g. herd_when,land_when,struct_when)'
        required: false
        default: ''
        type: string
      nseeds:
        description: 'calibrate only: seeds per calendar, each played both sides'
        required: false
        default: '48'
        type: string
      minutes:
        description: 'Climb budget in minutes (job cap is 350)'
        required: false
        default: '240'
        type: string
      resume:
        description: 'Continue from the calendar on the schedules branch'
        required: false
        default: true
        type: boolean
      accept:
        description: 'race = screen cheap then confirm the survivor on seeds it was not chosen on. plain = the old best-of-lambda on fixed seeds'
        required: false
        default: 'race'
        type: choice
        options: [race, plain]
      pool:
        description: 'race: the seeds a generation draws from, `a-b` or a list. Must not touch the held-out seeds'
        required: false
        default: '3000-3095'
        type: string
      screen:
        description: 'race: seeds in the screening draw (each played both sides)'
        required: false
        default: '3'
        type: string
      confirm:
        description: 'race: seeds in the confirmation draw, disjoint from the screen'
        required: false
        default: '8'
        type: string
      z:
        description: 'race: the t the confirmation must reach before an accept. 0 = accept a positive confirmation, which is what the spread cut leaves room for'
        required: false
        default: '0.0'
        type: string
      spread_cut:
        description: 'race: drop a child whose screening spread is above this rather than judging what cannot be judged'
        required: false
        default: '8000'
        type: string
      seeds:
        description: 'Training seeds. Under race these only pick which starting calendar to climb'
        required: false
        default: '3000,3001,3002,3003,3004,3005'
        type: string
      holdout:
        description: 'Held-out seeds, never optimised against'
        required: false
        default: '3100,3101,3102,3103,3104,3105'
        type: string
      opponent:
        description: 'Opponent: a path under kaggriculture/, a builtin name, or kernel:owner/slug. Must be v16 or stronger -- `wins` is degenerate against `starter`, which loses to everything'
        required: false
        default: 'main.py'
        type: string
      objective:
        description: 'wins | mean | min'
        required: false
        default: 'wins'
        type: string
      lam:
        description: 'Candidates per generation'
        required: false
        default: '4'
        type: string
      ops:
        description: 'Edits per candidate'
        required: false
        default: '2'
        type: string
      start:
        description: 'Starting calendars, comma separated, relative to kaggriculture/'
        required: false
        default: 'schedules/blueprint.json,schedules/ours.json'
        type: string

permissions:
  contents: write

concurrency:
  group: kaggriculture-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: kaggriculture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install kaggle-environments
        run: pip install -U kaggle-environments

      - name: Resolve the opponent
        # Climbing against v16 saturates: the calendar reached 12 wins out of 12
        # on both the training and the held-out seeds in seventeen generations,
        # after which `wins` has nothing left to say and only the tie-break
        # margin moves. Worse, that ceiling is not near the top -- the same
        # calendar then lost 24 games out of 24 to the published plan, 48,747
        # against 130,842. The leaderboard is a ladder against everyone, so the
        # bar with information left in it is the plan near the top of it.
        #
        # Their notebook is executed here, inside the runner, and never on the
        # workstation; opponents/ is gitignored so it is never redistributed.
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e
          opp="${{ inputs.opponent }}"
          if [ "${opp#kernel:}" != "$opp" ]; then
            ref="${opp#kernel:}"
            pip install 'kaggle==2.0.0' 'kagglesdk==0.1.15'
            python sim/fetch_opponent.py --exec "$ref"
            opp="opponents/${ref//\//__}.py"
            [ -s "$opp" ] || { echo "no agent file in notebook $ref" >&2; exit 1; }
          fi
          echo "OPP=$opp" >> "$GITHUB_ENV"
          echo "resolved opponent: $opp"

      - name: Calendar invariants
        # An operator that cannot fire, or one whose edit a repair pass quietly
        # undoes, would burn the whole climb without saying so. Four of the
        # seven were exactly that when first written: the cumulative columns
        # may not fall, so every decrease was being put back.
        run: python sim/test_sched_ops.py

      - name: Does the calendar bite
        # The three hooks sit inside main.py's purchase logic. If one of them
        # silently failed to reach the orders, nothing would crash -- the climb
        # would simply spend four hours accepting mutations on season noise.
        run: python sim/sched_bite.py

      - name: Fetch the schedules branch
        id: sched
        working-directory: .
        run: |
          set -e
          mkdir -p schedules
          if git fetch --depth=1 origin kaggriculture-schedules 2>/dev/null; then
            git show FETCH_HEAD:schedules/best.json > schedules/best.json 2>/dev/null \
              || rm -f schedules/best.json
            git show FETCH_HEAD:schedules/climb.txt > schedules/climb.txt 2>/dev/null \
              || rm -f schedules/climb.txt
            # The commit below rewrites this branch as a single orphan commit,
            # so anything not restored here is deleted by the next run. The
            # calibration matrix was lost exactly that way: a climb carries no
            # band.json, and one climb was enough to drop it.
            git show FETCH_HEAD:schedules/band.json > schedules/band.json 2>/dev/null \
              || rm -f schedules/band.json
            tail -3 schedules/climb.txt 2>/dev/null || true
          else
            echo "no schedules branch yet"
          fi
          if [ -s schedules/best.json ] && [ "${{ inputs.resume }}" = "true" ]; then
            echo "start=../schedules/best.json" >> "$GITHUB_OUTPUT"
          else
            echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that scoring is deterministic
        # The whole design rests on this. If the same calendar does not score
        # the same money twice, every accept below is measuring the season
        # rather than the edit, and the climb is a random walk. Unlike a replay
        # the policy is live here, so this is a real question, not a formality.
        run: |
          set -e
          python sim/optimize_schedule.py --sched "${{ steps.sched.outputs.start }}" \
            --selftest --seeds "${{ inputs.seeds }}" \
            --opponent "$OPP" | tee /tmp/selftest.log
          grep -q '^VERDICT=DETERMINISTIC' /tmp/selftest.log

      - name: Calibrate the ruler
        # Before believing any accept, find out what an accept can see. Same
        # incumbent, eight mutated children, all of them on the same seeds --
        # which gives the paired spread of a real edit, the number of episodes
        # needed to resolve one, and how much of a best-of-four pick survives
        # on episodes it was not picked on. That last number is what the climb
        # has been banking every generation.
        if: inputs.mode == 'calibrate'
        run: |
          set -e
          python sim/noise_band.py \
            --sched "${{ steps.sched.outputs.start }}" \
            --opponent "$OPP" \
            --children "${{ inputs.children }}" \
            --ops "${{ inputs.ops }}" \
            ${{ inputs.per_op && '--per-op' || '' }} \
            --only "${{ inputs.only }}" \
            --nseeds "${{ inputs.nseeds }}" \
            --out ../schedules/band.json \
            --workers "$(nproc)" | tee /tmp/band.log

      - name: Score calendars side by side
        # One question, and nothing written down: given these calendars and
        # these seeds, what does each earn, episode by episode?
        #
        # It exists because a climb's own arithmetic stopped adding up. Fifty
        # one generations under the race rule accepted eleven edits whose
        # confirmations summed to +56,290, and the held-out score moved
        # +3,270 with t = +0.73. Twelve held-out episodes cannot tell +3,270
        # from +56,290; ninety-six can. The climb already prints exactly the
        # per-episode numbers needed, as its CANDIDATE lines, so this is the
        # climb with a zero budget -- and its output pointed at a scratch
        # file, because the branch's calendar must not move when all that
        # happened was a measurement.
        if: inputs.mode == 'score'
        run: |
          set -e
          python sim/optimize_schedule.py \
            --sched "${{ inputs.start }}" \
            --out /tmp/scored.json \
            --opponent "$OPP" \
            --objective "${{ inputs.objective }}" \
            --seeds "${{ inputs.seeds }}" \
            --holdout "${{ inputs.holdout }}" \
            --minutes 0 \
            --workers "$(nproc)" | tee /tmp/score.log

      - name: Climb
        if: inputs.mode == 'climb'
        run: |
          set -e
          python sim/optimize_schedule.py \
            --sched "${{ steps.sched.outputs.start }}" \
            --out ../schedules/best.json \
            --opponent "$OPP" \
            --objective "${{ inputs.objective }}" \
            --seeds "${{ inputs.seeds }}" \
            --holdout "${{ inputs.holdout }}" \
            --accept "${{ inputs.accept }}" \
            --pool "${{ inputs.pool }}" \
            --screen "${{ inputs.screen }}" \
            --confirm "${{ inputs.confirm }}" \
            --z "${{ inputs.z }}" \
            --spread-cut "${{ inputs.spread_cut }}" \
            --lam "${{ inputs.lam }}" --ops "${{ inputs.ops }}" \
            --minutes "${{ inputs.minutes }}" \
            --workers "$(nproc)" | tee /tmp/climb.log

      - name: Score the result against the live agent
        # The climb's own number is measured on its training seeds. What decides
        # whether this is worth submitting is a paired-seed match against the
        # agent currently on the leaderboard, on seeds neither was tuned on.
        if: always() && inputs.mode == 'climb'
        run: |
          set -e
          [ -s ../schedules/best.json ] || exit 0
          python sim/emit_sched.py ../schedules/best.json \
            --note "run ${{ github.run_number }}: ${{ inputs.memo }}" \
            --out agents/sched_agent_build.py
          python sim/evaluate.py --a agents/sched_agent_build.py --b main.py \
            --episodes 12 --seed0 4000 --workers "$(nproc)" | tee /tmp/head2head.log
          # And against whatever it actually climbed against, when that is
          # not v16 -- beating the agent already on the leaderboard is the
          # floor, and today it is a floor 82,000 below the top.
          if [ "$OPP" != "main.py" ]; then
            python sim/evaluate.py --a agents/sched_agent_build.py --b "$OPP" \
              --episodes 12 --seed0 4000 --workers "$(nproc)" | tee /tmp/vs_opp.log
          fi

      - name: Commit the calendar
        if: always()
        working-directory: .
        run: |
          set -e
          [ -s schedules/best.json ] || [ -s schedules/band.json ] || exit 0
          if [ -s /tmp/climb.log ]; then
            grep -E '^(CANDIDATE|CHOSE|GEN|HOLDOUT|SUMMARY=)' /tmp/climb.log \
              > schedules/climb.txt || true
            grep -E '^(SUMMARY=|VERDICT=)' /tmp/head2head.log \
              >> schedules/climb.txt 2>/dev/null || true
            grep -E '^(SUMMARY=|VERDICT=)' /tmp/vs_opp.log \
              >> schedules/climb.txt 2>/dev/null || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan schedules-tmp
          git reset
          git add -f schedules/best.json schedules/climb.txt 2>/dev/null || true
          git add -f schedules/band.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "kaggriculture: calendar after run ${{ github.run_number }} (${{ inputs.memo }})"
          git push -f origin schedules-tmp:kaggriculture-schedules

      - name: Job summary
        if: always()
        working-directory: .
        run: |
          {
            echo "### Kaggriculture schedule"
            echo ""
            echo "memo: ${{ inputs.memo }}"
            echo ""
            echo '```'
            if [ -s /tmp/band.log ]; then
              sed -n '/== per-child/,$p' /tmp/band.log
            elif [ -s /tmp/score.log ]; then
              grep -E '^(CANDIDATE|CHOSE)' /tmp/score.log || tail -5 /tmp/score.log
            else
              grep -E '^(CANDIDATE|CHOSE|HOLDOUT|SUMMARY=)' /tmp/climb.log \
                || tail -5 /tmp/climb.log
              echo ""
              gens=$(grep -c '^GEN ' /tmp/climb.log || true)
              took=$(grep -c 'ACCEPT' /tmp/climb.log || true)
              echo "accepted ${took:-0} of ${gens:-0} generations"
            fi
            echo ""
            echo "-- vs the live agent --"
            grep -E '^(SUMMARY=|VERDICT=)' /tmp/head2head.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
