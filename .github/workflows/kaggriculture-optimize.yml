name: Kaggriculture Optimize

# Hill-climb the 720-step action list itself.
#
# The plan, not the policy, is what this competition rewards: every published
# agent above 100k is a fixed action list with a repair layer, and eleven
# attempts at closing the gap from inside a per-turn policy all came back a tie
# or worse. So this job searches the list.
#
# Results are committed to the `kaggriculture-plans` branch rather than uploaded
# as artifacts, because the account's Actions storage is over quota and any
# upload hard-fails the run. Committing has a second benefit: a 6h job is not
# long enough to converge, so the next run resumes from the branch and the climb
# continues across jobs. The branch is rewritten as a single orphan commit each
# time, so it never accumulates history for a file that changes every run.

on:
  schedule:
    # every six hours, so one climb hands over to the next
    - cron: '20 */6 * * *'
  workflow_dispatch:
    # These defaults are the chain's settings and must match the fallbacks in
    # `env:` below. They did not, and the RPi5 backstop dispatches with only
    # memo and resume: on 2026-09-21 two links (runs 35562904219 and
    # 35654532887) climbed the shared checkpoint against `starter` on four
    # seeds, and the scheduled links after them reopened the checkpoint on the
    # real opponent at 32,470 (it had closed at 77,428) and 70,636 (from 75,629).
    inputs:
      memo:
        description: 'この実行の意図（手動実行では必須）'
        required: false
        default: 'chained climb'
        type: string
      minutes:
        description: 'Climb budget in minutes (job cap is 350)'
        required: false
        default: '340'
        type: string
      resume:
        description: 'Continue the checkpoint on the plans branch'
        required: false
        default: true
        type: boolean
      seeds:
        description: 'Training seeds (comma separated)'
        required: false
        default: '3000,3001,3002,3003,3004,3005,3006,3007,3008,3009,3010,3011'
        type: string
      holdout:
        description: 'Held-out seeds, never optimised against'
        required: false
        default: '3100,3101,3102,3103,3104,3105'
        type: string
      opponent:
        description: 'Opponent to score against (builtin name or path)'
        required: false
        default: 'agents/v48_sched.py'
        type: string
      objective:
        description: 'margin | mean | wins | min. `margin` (own money minus theirs, the chain default) is what a win/loss ladder pays; `mean` climbed its own money while the opponent took 93-110k (0 of 6 won). `wins` is flat at zero while you lose every game'
        required: false
        default: 'margin'
        type: choice
        options: ['margin', 'mean', 'wins', 'min']
      lam:
        description: 'Candidates per generation'
        required: false
        default: '4'
        type: string
      ops:
        description: 'Edits per candidate'
        required: false
        default: '6'
        type: string
      record_seeds:
        description: 'Seeds to record starting plans from (the best is used)'
        required: false
        default: '3000,3001,3002'
        type: string
      start_agent:
        description: 'Also offer this agent plan as a start: path or kernel:owner/slug'
        required: false
        default: ''
        type: string
      record_agent:
        description: 'Agent whose play is recorded into the starting plans'
        required: false
        default: 'agents/v48_sched.py'
        type: string
      sides:
        description: 'Seats to score each seed on. 0,1 scores both (twice the cost); 0 scores one'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: kaggriculture-optimize
  cancel-in-progress: false

jobs:
  gate:
    # The schedule is only for the days before the competition closes. After
    # that the chain has nothing to climb towards and should stop by itself.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.win.outputs.go }}
    steps:
      - id: win
        run: |
          go=1
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y%m%d)" -gt 20260930 ]; then
            go=0
            echo "the competition closed; remove the schedule from this workflow"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  optimize:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # `inputs` is null on a schedule event. Reading it directly would make
      # RESUME empty, and an empty RESUME records a fresh plan every six hours.
      MEMO: ${{ github.event.inputs.memo || 'chained climb' }}
      MINUTES: ${{ github.event.inputs.minutes || '340' }}
      RESUME: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.resume }}
      SEEDS: ${{ github.event.inputs.seeds || '3000,3001,3002,3003,3004,3005,3006,3007,3008,3009,3010,3011' }}
      HOLDOUT: ${{ github.event.inputs.holdout || '3100,3101,3102,3103,3104,3105' }}
      OPPONENT: ${{ github.event.inputs.opponent || 'agents/v48_sched.py' }}
      OBJECTIVE: ${{ github.event.inputs.objective || 'margin' }}
      LAM: ${{ github.event.inputs.lam || '4' }}
      OPS: ${{ github.event.inputs.ops || '6' }}
      SIDES: ${{ github.event.inputs.sides || '0' }}
      RECORD_SEEDS: ${{ github.event.inputs.record_seeds || '3000,3001,3002' }}
      RECORD_AGENT: ${{ github.event.inputs.record_agent || 'agents/v48_sched.py' }}
    defaults:
      run:
        working-directory: kaggriculture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install kaggle-environments
        run: pip install -U kaggle-environments

      - name: Mutation invariants
        # An operator that cannot fire, or that invents a hand the farm never
        # hired, would burn the whole climb without saying so. Cheap to check
        # here, invisible once the job is running.
        run: python sim/test_plan_ops.py

      - name: Fetch the plans branch
        id: plans
        working-directory: .
        run: |
          set -e
          mkdir -p plans
          if git fetch --depth=1 origin kaggriculture-plans 2>/dev/null; then
            for f in best.json checkpoint.json climb.txt; do
              git show "FETCH_HEAD:plans/$f" > "plans/$f" 2>/dev/null || rm -f "plans/$f"
            done
            ls -la plans
            tail -3 plans/climb.txt 2>/dev/null || true
          else
            echo "no plans branch yet"
          fi
          if [ -s plans/checkpoint.json ] && [ "$RESUME" = "true" ]; then
            echo "resume=1" >> "$GITHUB_OUTPUT"
          else
            echo "resume=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the starting plans
        # Only when there is nothing to resume. One recording per seed, because
        # a plan recorded on a single season carries that season in it: the
        # first smoke run scored 78,083 on the seed it was recorded from and
        # 28,908 on seeds it had never seen. optimize.py scores every candidate
        # on the training seeds and starts from whichever transfers best.
        id: starts
        if: steps.plans.outputs.resume != '1'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          START_AGENT: ${{ github.event.inputs.start_agent }}
        run: |
          set -e
          list=""
          for seed in $(echo "$RECORD_SEEDS" | tr ',' ' '); do
            python sim/record.py --a "$RECORD_AGENT" --b "$OPPONENT" --seed "$seed" --out "../plans/start_$seed.json"
            list="$list,../plans/start_$seed.json"
          done
          if [ -n "$START_AGENT" ]; then
            # A published plan, read as data. route_shape.load_plan pulls the
            # embedded action list straight out of the file, so their module is
            # never imported -- and scoring it under *this* replay is what says
            # how much of a published score is the plan itself and how much is
            # the repair layer wrapped around it.
            extra="$START_AGENT"
            case "$extra" in
              kernel:*)
                ref="${extra#kernel:}"
                pip install 'kaggle==2.0.0' 'kagglesdk==0.1.15'
                python sim/fetch_opponent.py --exec "$ref"
                extra="opponents/${ref//\//__}.py"
                ;;
            esac
            [ -s "$extra" ] || { echo "no agent file at $extra" >&2; exit 1; }
            list="$list,$extra"
          fi
          echo "plans=${list#,}" >> "$GITHUB_OUTPUT"

      - name: Check that scoring is deterministic
        # The whole design rests on this. If the same plan does not score the
        # same money twice, then every accept below is measuring the season
        # rather than the edit, and the climb is a random walk.
        env:
          SRC: ${{ steps.plans.outputs.resume == '1' && '--resume ../plans/checkpoint.json' || format('--plan {0}', steps.starts.outputs.plans) }}
        run: |
          set -e
          echo "SRC=$SRC"
          python sim/optimize.py $SRC --selftest \
            --seeds "$SEEDS" --opponent "$OPPONENT" \
            --sides "$SIDES" \
            --workers "$(nproc)" | tee /tmp/selftest.log
          grep -q '^VERDICT=DETERMINISTIC' /tmp/selftest.log

      - name: Climb
        env:
          SRC: ${{ steps.plans.outputs.resume == '1' && '--resume ../plans/checkpoint.json' || format('--plan {0}', steps.starts.outputs.plans) }}
        run: |
          set -e
          python sim/optimize.py $SRC \
            --out ../plans/best.json \
            --checkpoint ../plans/checkpoint.json \
            --opponent "$OPPONENT" \
            --objective "$OBJECTIVE" \
            --seeds "$SEEDS" \
            --holdout "$HOLDOUT" \
            --sides "$SIDES" \
            --lam "$LAM" --ops "$OPS" \
            --minutes "$MINUTES" \
            --workers "$(nproc)" | tee /tmp/climb.log

      - name: Score the result against v48_sched
        # The climb's own number is money on its training seeds. What decides
        # whether this is worth submitting is a paired-seed match against the
        # agent that would be submitted in its place (v48_sched), on seeds neither of them
        # was tuned on.
        if: always()
        run: |
          set -e
          [ -s ../plans/best.json ] || exit 0
          python sim/record.py --emit ../plans/best.json --out agents/plan_agent.py
          python sim/evaluate.py --a agents/plan_agent.py --b agents/v48_sched.py \
            --episodes 12 --seed0 4000 --workers "$(nproc)" | tee /tmp/head2head.log

      - name: Commit the plan
        if: always()
        working-directory: .
        run: |
          set -e
          [ -s plans/checkpoint.json ] || exit 0
          grep -E '^(RESUMED|CANDIDATE|CHOSE|START|HOLDOUT|SUMMARY=)' /tmp/climb.log > plans/climb.txt || true
          grep -E '^(SUMMARY=|VERDICT=)' /tmp/head2head.log >> plans/climb.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan plans-tmp
          git reset
          git add -f plans/best.json plans/checkpoint.json plans/climb.txt
          git commit -q -m "kaggriculture: plan after run ${{ github.run_number }} ($MEMO)"
          git push -f origin plans-tmp:kaggriculture-plans

      - name: Job summary
        if: always()
        working-directory: .
        run: |
          {
            echo "### Kaggriculture optimize"
            echo ""
            echo "memo: $MEMO"
            echo ""
            echo '```'
            grep -E '^(CANDIDATE|CHOSE|START|RESUMED|HOLDOUT|SUMMARY=)' /tmp/climb.log || tail -5 /tmp/climb.log
            echo ""
            echo "-- vs agents/v48_sched.py (fresh seeds 4000+) --"
            grep -E '^(SUMMARY=|VERDICT=)' /tmp/head2head.log 2>/dev/null || true
            echo '```'
            echo ""
            echo "<details><summary>operators</summary>"
            echo ""
            echo '```'
            sed -n '/^OPERATORS/,/^$/p' /tmp/climb.log || true
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>accepted generations</summary>"
            echo ""
            echo '```'
            grep -E '^gen [0-9]+ ACCEPT' /tmp/climb.log | tail -60 || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
