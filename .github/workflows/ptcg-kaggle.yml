name: PTCG Kaggle Submit

# File submission for the-pokemon-company-ptcg-ai-battle-challenge-playground, from a cloud session:
# push ptcg/requests/submit.json (any branch but main) holding id (new per request), memo, message.
# Builds ptcg/submission.tar.gz from main.py + deck.csv (top level) and submits it.
# The outcome is committed back as ptcg/requests/results/submit-<run id>.txt.

on:
  push:
    branches-ignore: [main]
    paths:
      - 'ptcg/requests/submit.json'

permissions:
  contents: write

concurrency:
  group: ptcg-kaggle
  cancel-in-progress: false

env:
  COMP: the-pokemon-company-ptcg-ai-battle-challenge-playground

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install kaggle CLI
        run: pip install -q six 'kaggle==2.0.0' 'kagglesdk==0.1.15'
      - name: Read the request
        run: |
          python - <<'PY'
          import json, os, glob
          r = json.load(open("ptcg/requests/submit.json", encoding="utf-8"))
          rid = str(r.get("id", "")).strip(); assert rid, "id is required"
          for g in glob.glob("ptcg/requests/results/*.txt"):
              if f"request: {rid}\n" in open(g, encoding="utf-8").read():
                  print("already ran"); open(os.environ["GITHUB_ENV"], "a").write("SKIP=yes\n"); raise SystemExit(0)
          memo = str(r.get("memo", "")).strip(); assert memo, "memo is required"
          msg = str(r.get("message", memo)).replace("\n", " ")
          with open(os.environ["GITHUB_ENV"], "a") as g:
              g.write(f"RID={rid}\nMSG={msg}\n"); g.write("MEMO<<__EOF__\n" + memo + "\n__EOF__\n")
          PY
      - name: Build and submit
        if: env.SKIP != 'yes'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -o pipefail
          cd ptcg
          python -c "import ast;ast.parse(open('main.py').read())"
          test "$(grep -c . deck.csv)" -ge 60
          tar czf /tmp/submission.tar.gz main.py deck.csv
          tar tzf /tmp/submission.tar.gz | tee /tmp/out.txt
          kaggle competitions submit "$COMP" -f /tmp/submission.tar.gz -m "$MSG [run ${GITHUB_RUN_ID}]" 2>&1 | tail -2 | tee -a /tmp/out.txt
          sleep 20
          kaggle competitions submissions "$COMP" 2>&1 | head -4 | tee -a /tmp/out.txt
          grep -q "run ${GITHUB_RUN_ID}" /tmp/out.txt || { echo "::error::submission not found"; exit 1; }
      - name: Commit the outcome
        if: always() && env.SKIP != 'yes'
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
        run: |
          out="ptcg/requests/results/submit-${RUN_ID}.txt"; mkdir -p "$(dirname "$out")"
          { echo "request: ${RID:-}"; echo "run: ${RUN_ID}  status: ${OUTCOME}"; echo "memo: ${MEMO:-}"; echo; cat /tmp/out.txt 2>/dev/null || true; } > "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"; git commit -q -m "ptcg: kaggle outcome ${RUN_ID}"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0; sleep $((i*5)); done
          exit 1
