name: Enveda CASMI26 Kaggle

# The way in for a cloud session, which may push but may not dispatch:
# a push of enveda-casmi26/requests/kaggle.json on any branch runs this job,
# and the outcome is committed back to the same branch as
# enveda-casmi26/requests/results/kaggle-<run id>.txt.
#
# The request file holds:
#   id       a new id for every request (required); a request whose id already
#            appears in requests/results/ is skipped, so a replayed file never reruns
#   memo     why this run (required)
#   action   "kernel" (push a kernel and wait for it) or "dataset" (create or version a dataset)
#   dir      a directory under enveda-casmi26/ holding kernel-metadata.json or dataset-metadata.json
#   submit   kernel only: "submit" to send the finished kernel's submission.csv to the competition
#   message  submission / dataset version message
#   wait     kernel only: "no" to return right after the push (long training runs; read the
#            log later from www.kaggle.com/api/v1/kernels/output) so the queue is not held
#   action "output": download a finished kernel's output (no push) and commit the files that match
#            "files" (a glob, default "val_*") under requests/results/out-<id>/ (the cloud session cannot
#            reach www.kaggleusercontent.com, where the output files are served); "dir" names the kernel
#   action "dsfiles": download the small text files (<= 1 MB) of a public dataset "ref" (owner/slug) that match
#            "files" (a glob over the path inside the dataset) into requests/results/ds-<id>/ (for reading
#            public code, e.g. a model's training scripts; never a competition file)
#   post     output only: a .py under enveda-casmi26/ run on the downloaded files; then only its printout
#            goes into the outcome file and the files are not committed (e.g. tools/val_report.py)
#   version  kernel only: an already pushed version number; skip the push and wait for /
#            submit that version (a TPU run can sit in the queue longer than this job may wait)
# Only the user's standing instruction allows a submit (see enveda-casmi26/CLAUDE.md).

on:
  workflow_dispatch:
  push:
    # Not on main: merging a work branch would replay its last request there
    # (2026-09-26: the path-check submit ran twice that way).
    branches-ignore: [main]
    paths:
      - 'enveda-casmi26/requests/kaggle.json'

permissions:
  contents: write

concurrency:
  group: enveda-kaggle
  cancel-in-progress: false

env:
  COMP: enveda-CASMI26-molecule-id-mass-spectra

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install kaggle CLI
        # kaggle 2.0.0 needs kagglesdk pinned to 0.1.15 (see kaggle-push.yml).
        run: pip install -q 'kaggle==2.0.0' 'kagglesdk==0.1.15'

      - name: Read the request
        run: |
          python - <<'PY'
          import json, os
          r = json.load(open("enveda-casmi26/requests/kaggle.json", encoding="utf-8"))
          rid = str(r.get("id", "")).strip()
          assert rid, "id is required"
          import glob
          for f in glob.glob("enveda-casmi26/requests/results/*.txt"):
              if f"request: {rid}\n" in open(f, encoding="utf-8").read():
                  print(f"request {rid} already ran ({f}); skipping")
                  with open(os.environ["GITHUB_ENV"], "a") as g:
                      g.write("SKIP=yes\n")
                  raise SystemExit(0)
          memo = str(r.get("memo", "")).strip()
          assert memo, "memo is required"
          action = r.get("action")
          assert action in ("kernel", "dataset", "output", "dsfiles"), "action must be kernel, dataset, output or dsfiles"
          if action == "dsfiles":
              ref = str(r.get("ref", ""))
              assert ref.count("/") == 1 and ".." not in ref and "enveda-CASMI26" not in ref, "ref must be owner/slug"
              r.setdefault("dir", "requests")
              with open(os.environ["GITHUB_ENV"], "a") as g:
                  g.write(f"DSREF={ref}\n")
          d = str(r.get("dir", ""))
          assert d and ".." not in d and not d.startswith("/"), "dir must be relative, without .."
          d = os.path.join("enveda-casmi26", d)
          assert os.path.isdir(d), f"not found: {d}"
          submit = r.get("submit", "") == "submit"
          nowait = r.get("wait", "") == "no"
          assert not (submit and nowait), "submit needs the wait"
          msg = str(r.get("message", memo)).replace("\n", " ")
          usever = str(r.get("version", "")).strip()
          assert usever == "" or usever.isdigit(), "version must be a number"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RID={rid}\nACTION={action}\nDIR={d}\nSUBMIT={'yes' if submit else 'no'}\nNOWAIT={'yes' if nowait else 'no'}\nUSEVER={usever}\nMSG={msg}\n")
              f.write("MEMO<<__EOF__\n" + memo + "\n__EOF__\n")
              pat = str(r.get("files", "val_*"))
              assert "/" not in pat and ".." not in pat, "files must be a plain glob"
              f.write(f"OUTGLOB={pat}\n")
              post = str(r.get("post", "")).strip()
              assert post == "" or (post.endswith(".py") and ".." not in post and os.path.isfile(os.path.join("enveda-casmi26", post))), "post must be a .py under enveda-casmi26/"
              f.write(f"POST={post}\n")
          print(action, d, "submit" if submit else "no submit", "|", memo)
          PY

      - name: Dataset create or version
        if: env.ACTION == 'dataset' && env.SKIP != 'yes'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -o pipefail
          # A dataset folder may carry prepare.sh to fetch what should not live in git.
          if [ -f "$DIR/prepare.sh" ]; then sh "$DIR/prepare.sh"; fi
          ID=$(python -c "import json;print(json.load(open('$DIR/dataset-metadata.json'))['id'])")
          if kaggle datasets status "$ID" >/dev/null 2>&1; then
            kaggle datasets version -p "$DIR" -m "$MSG" -r zip 2>&1 | tee /tmp/out.txt
          else
            kaggle datasets create -p "$DIR" -r zip 2>&1 | tee /tmp/out.txt
          fi

      - name: Kernel push, wait, (submit)
        if: env.ACTION == 'kernel' && env.SKIP != 'yes'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -o pipefail
          ID=$(python -c "import json;print(json.load(open('$DIR/kernel-metadata.json'))['id'])")
          echo "KERNEL=$ID" >> "$GITHUB_ENV"
          if [ -n "$USEVER" ]; then
            VER=$USEVER
            echo "no push: using the already pushed version $VER" | tee /tmp/out.txt
          else
            OUT=$(kaggle kernels push -p "$DIR" 2>&1) || true
            echo "$OUT" | tee /tmp/out.txt
            # The CLI exits 0 on a push error, so success is read from its text.
            echo "$OUT" | grep -q "successfully pushed" || { echo "::error::push not confirmed"; exit 1; }
            VER=$(echo "$OUT" | grep -oE 'version [0-9]+' | head -1 | grep -oE '[0-9]+')
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "pushed $ID version $VER"
          if [ "$NOWAIT" = "yes" ]; then echo "wait: no -> not waiting for the kernel"; exit 0; fi
          sleep 60
          for i in $(seq 1 330); do
            S=$(kaggle kernels status "$ID" 2>&1 || true)
            echo "$(date -u +%H:%M) $S"
            case "$S" in
              *COMPLETE*) break ;;
              *ERROR*|*CANCEL*) echo "::error::kernel ended: $S"; kaggle kernels output "$ID" -p /tmp/kout >/dev/null 2>&1 || true; tail -50 /tmp/kout/*.log 2>/dev/null || true; exit 1 ;;
            esac
            sleep 60
          done
          echo "$S" | grep -q COMPLETE || { echo "::error::kernel did not finish in time"; exit 1; }
          mkdir -p /tmp/kout && kaggle kernels output "$ID" -p /tmp/kout >/dev/null 2>&1 || true
          ls -la /tmp/kout
          head -c 600 /tmp/kout/submission.csv 2>/dev/null || echo "no submission.csv in the output"
          if [ "$SUBMIT" = "yes" ]; then
            test -s /tmp/kout/submission.csv || { echo "::error::no submission.csv to submit"; exit 1; }
            kaggle competitions submit "$COMP" -k "$ID" -v "$VER" -f submission.csv -m "$MSG [run ${GITHUB_RUN_ID}]" 2>&1 | tee -a /tmp/out.txt
            sleep 30
            # head closes the pipe early (SIGPIPE under pipefail once the list is long), so the listing never fails the step
            { kaggle competitions submissions "$COMP" -v 2>&1 || true; } | head -5 | tee -a /tmp/out.txt || true
            grep -q "run ${GITHUB_RUN_ID}" /tmp/out.txt || { echo "::error::submission not found in the list"; exit 1; }
          fi

      - name: Kernel output to the repo
        if: env.ACTION == 'output' && env.SKIP != 'yes'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -o pipefail
          ID=$(python -c "import json;print(json.load(open('$DIR/kernel-metadata.json'))['id'])")
          echo "KERNEL=$ID" >> "$GITHUB_ENV"
          dst="enveda-casmi26/requests/results/out-${RID}"
          if [ -n "$POST" ]; then dst=/tmp/kres; fi
          mkdir -p "$dst"
          # the CLI fetches only the first page (500 files) of the output listing, so page through it here
          python - "$ID" "$OUTGLOB" "$dst" <<'PY' 2>&1 | tee /tmp/out.txt
          import fnmatch, os, sys, requests
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiListKernelSessionOutputRequest
          kid, pat, dst = sys.argv[1:]
          user, slug = kid.split("/")
          api = KaggleApi(); api.authenticate()
          tok, files = "", []
          with api.build_kaggle_client() as kg:
              while True:
                  rq = ApiListKernelSessionOutputRequest()
                  rq.user_name, rq.kernel_slug = user, slug
                  if tok:
                      rq.page_token = tok
                  rs = kg.kernels.kernels_api_client.list_kernel_session_output(rq)
                  files += [{"fileName": f.file_name, "url": f.url} for f in rs.files]
                  tok = rs.next_page_token or ""
                  if not tok:
                      break
          print("listed", len(files), "files")
          n = 0
          for f in files:
              name = f.get("fileName", "")
              if "/" in name or not fnmatch.fnmatch(name, pat):
                  continue
              data = requests.get(f["url"], timeout=300).content
              if len(data) > 20_000_000:
                  print("skip (too big)", name, len(data))
                  continue
              open(os.path.join(dst, name), "wb").write(data)
              n += 1
              print("got", name, len(data))
          print("copied", n, "files to", dst)
          PY
          n=$(ls "$dst" | wc -l)
          test "$n" -gt 0 || { echo "::error::no file matched $OUTGLOB"; exit 1; }
          if [ -n "$POST" ]; then
            pip install -q rdkit pandas numpy
            python "enveda-casmi26/$POST" "$dst" 2>&1 | tee -a /tmp/out.txt
          fi

      - name: Dataset files to the repo
        if: env.ACTION == 'dsfiles' && env.SKIP != 'yes'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p /tmp/ds && cd /tmp/ds
          kaggle datasets download "$DSREF" --unzip -q 2>&1 | tail -3 | tee /tmp/out.txt || true
          cd "$GITHUB_WORKSPACE"
          dst="enveda-casmi26/requests/results/ds-${RID}"
          mkdir -p "$dst"
          python - "$OUTGLOB" "$dst" <<'PY' 2>&1 | tee -a /tmp/out.txt
          import fnmatch, os, shutil, sys
          pat, dst = sys.argv[1:]
          n = 0
          for root, _, fs in os.walk("/tmp/ds"):
              for f in fs:
                  p = os.path.join(root, f)
                  rel = os.path.relpath(p, "/tmp/ds")
                  if not fnmatch.fnmatch(rel, pat) or os.path.getsize(p) > 1_000_000:
                      continue
                  try:
                      open(p, encoding="utf-8").read()
                  except Exception:
                      continue
                  q = os.path.join(dst, rel)
                  os.makedirs(os.path.dirname(q), exist_ok=True)
                  shutil.copy(p, q)
                  n += 1
                  print("got", rel, os.path.getsize(p))
          print("copied", n, "files")
          PY

      - name: Commit the outcome
        if: always() && github.event_name == 'push' && env.SKIP != 'yes'
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
        run: |
          out="enveda-casmi26/requests/results/kaggle-${RUN_ID}.txt"
          mkdir -p "$(dirname "$out")"
          {
            echo "request: ${RID:-}"
            echo "run: ${RUN_ID}  status: ${OUTCOME}  action: ${ACTION:-?}  dir: ${DIR:-?}  submit: ${SUBMIT:-?}"
            echo "kernel: ${KERNEL:-}  version: ${VERSION:-}"
            echo "memo: ${MEMO:-}"
            echo
            cat /tmp/out.txt 2>/dev/null || true
            echo
            echo "output files:"; ls -la /tmp/kout 2>/dev/null || true
            head -c 1500 /tmp/kout/*.log 2>/dev/null || true
          } > "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          if [ -d "enveda-casmi26/requests/results/out-${RID:-none}" ]; then git add "enveda-casmi26/requests/results/out-${RID}"; fi
          if [ -d "enveda-casmi26/requests/results/ds-${RID:-none}" ]; then git add -f "enveda-casmi26/requests/results/ds-${RID}"; fi
          git commit -q -m "enveda-casmi26: kaggle outcome ${RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5))
          done
          echo "could not push the outcome"; exit 1
